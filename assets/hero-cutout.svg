<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2c2ab"/>
      <stop offset="1" stop-color="#a8947f"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa0b9"/>
      <stop offset="1" stop-color="#5f738b"/>
    </linearGradient>
    <linearGradient id="shoes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7dfd2"/>
      <stop offset="1" stop-color="#b9b0a3"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Transparent background, cutout-style illustration -->
  <g filter="url(#ds)" transform="translate(110 90) rotate(-12 490 520)">
    <!-- torso -->
    <path d="M520 160c110 10 190 100 210 228 22 144-14 296-106 374-92 78-230 64-322-24-112-106-150-320-92-456 32-74 122-132 310-122z"
          fill="url(#jacket)"/>

    <!-- hood -->
    <path d="M560 120c76 8 120 52 126 114 6 66-34 124-92 142-62 20-136-8-166-66-28-52-4-160 132-190z"
          fill="#c6b39c" opacity="0.95"/>

    <!-- inner shadow seam -->
    <path d="M480 258c70 10 144 0 204-28" stroke="#0f0f10" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>

    <!-- pants -->
    <path d="M420 610c64 22 126 22 206-8 30 92 20 194-10 270-24 60-68 112-136 120-72 8-122-46-146-118-30-88-22-186 86-264z"
          fill="url(#pants)"/>

    <!-- baggy overlay -->
    <path d="M360 642c80 22 152 18 248-12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="18" stroke-linecap="round"/>

    <!-- shoes -->
    <path d="M418 944c68 30 134 30 210-6 22 14 32 36 26 56-8 28-40 46-92 54-88 14-184-14-214-50-18-22-12-42 70-54z"
          fill="url(#shoes)"/>
  </g>
</svg>

